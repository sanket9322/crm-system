spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=${PORT:8080}

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Transactional email via Resend HTTP API (works on Railway; SMTP ports are blocked)
crm.email.provider=resend
crm.email.from=${EMAIL_FROM}
crm.email.api-key=${RESEND_API_KEY}
crm.email.api-url=https://api.resend.com/emails